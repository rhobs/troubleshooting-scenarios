- conversation_group_id: refused_connections
  description: |
    Gateway-proxy returns repeated connection refused errors in the ingress-layer namespace.
    RCA: The production gateway selects database and cache endpoints from a non-production environment, and those endpoints do not accept connections.
    Expected: Correlate the active configuration with the runtime connection failures, identify the environment mismatch, recommend restoring the production endpoints, and verify successful traffic.
  tag:
    - classic
    - core
    - difficulty_medium

  turns:
    - turn_id: investigate_refused_connections
      query: >-
        Requests through gateway-proxy in ingress-layer started failing. Can you
        investigate the cause?
      expected_response: >-
        The production gateway is configured to use database and cache endpoints
        from a staging or other non-production environment. Those endpoints are
        refusing connections, which causes the gateway failures. Restore the
        production endpoint configuration and verify that requests succeed.
      turn_metrics:
        - custom:answer_correctness
