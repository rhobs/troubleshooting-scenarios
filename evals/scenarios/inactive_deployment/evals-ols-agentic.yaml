- conversation_group_id: inactive_deployment
  description: |
    Application is completely down, no traffic served.
    RCA: the deployment has replicas set to 0.
    Expected: scale the deployment back up (e.g. to 1 replica).
  tag:
    - investigation
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Users report that the web application newsletter-sender in
          namespace newsletter-sender is completely down and no traffic is
          being served. Investigate why and recommend how to restore
          service.
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the deployment newsletter-sender has replicas set
        to 0, so no pods exist. The workload itself is healthy and there
        are no error events. Remediation: scale the deployment back up
        (e.g. to 1 replica) and verify the pod reaches Running and Ready.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
