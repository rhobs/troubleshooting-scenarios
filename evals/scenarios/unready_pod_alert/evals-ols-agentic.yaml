- conversation_group_id: unready_pod
  description: |
    Alert fires for a pod in not-ready state.
    RCA: the readiness probe does an HTTP GET on port 9200 but the
    container is a simple echo/sleep loop with no HTTP server.
    Expected: remove the readiness probe or replace it with an exec
    probe appropriate for the container.
  tag:
    - investigation
    - core
    - alert
    - difficulty_medium


  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Alert: DiscoveryHubPodNotReady (warning)
          Namespace: discovery-hub
          Description: Pod discovery-hub/catalog-index-service has been in a not-ready state for more than 15 seconds.
          Investigate using the skill at /app/skills/cluster-troubleshoot/investigate-alert
        tools:
          skills:
            - image: quay.io/openshiftanalytics/agentic-skills:latest
              paths:
                - /skills/cluster-troubleshoot/investigate-alert
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the catalog-index-service pod is not ready because its
        readiness probe is failing. The pod runs a busybox container with a
        simple echo/sleep loop but has an HTTP readiness probe configured to
        GET /healthz on port 9200. Since the container does not run an HTTP
        server, nothing listens on port 9200, and the probe always fails
        with connection refused. Fix: either add an HTTP server that responds
        on port 9200, change the probe to an exec-based probe that matches
        what the container actually runs, or remove the readiness probe.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
