- conversation_group_id: timeout_connections
  description: |
    Frontend logs connection timeouts to the backend, which appears
    healthy.
    RCA: a NetworkPolicy only allows ingress from pods labelled
    tier=backend; the frontend has tier=frontend, so traffic is
    blocked.
    Expected: update the NetworkPolicy ingress rule to allow
    tier=frontend.
  tag:
    - investigation
    - core
    - difficulty_normal


  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          The frontend application in the service-mesh namespace is logging
          repeated "ERROR: Connection timeout to backend-service!" messages.
          The backend pod appears to be running and healthy.

          Investigate the connectivity issue between frontend and backend
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the backend-network-policy NetworkPolicy only allows
        ingress to backend pods from pods with label tier=backend, but the
        frontend pod has label tier=frontend. This causes all traffic from
        frontend to backend-service on port 8080 to be blocked. Fix: update
        the NetworkPolicy ingress rule to allow pods with tier=frontend
        (or app=frontend), or relabel the frontend pod to tier=backend.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
