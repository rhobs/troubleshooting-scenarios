  setup_script: scenarios/config_drift_analysis/setup.sh
  cleanup_script: scenarios/config_drift_analysis/cleanup.sh
  conversation_metrics: []
  conversation_metrics_metadata: {}
  turns:
    - turn_id: turn_1
      proposal_spec:
        request: >-
          What is causing connection refused errors in gateway-proxy in
          namespace ingress-layer? Analyze the pod logs to identify the
          root cause.
        targetNamespaces:
          - ingress-layer
        tools:
          skills:
            - image: quay.io/harpatil/agentic-skills:latest
              paths:
                - /skills/find-token
        analysis:
          agent: eval-default
      expected_proposal_status:
        phase: Completed
        max_duration: "10m"
        analysis:
          min_options: 1
      expected_outcome: >-
        The connection refused errors started after a config reload that
        loaded staging database settings (db-staging.internal,
        redis-staging.internal) in a production environment. The gateway-proxy
        hot-reloaded /config/app.yaml which pointed upstreams to staging
        hosts unreachable from the production VPC.
      expected_analysis_outcome: >-
        The agent should identify the config reload event as the root cause,
        noting that the new config references staging hosts
        (db-staging.internal, redis-staging.internal) while the environment
        is PRODUCTION, and these staging hosts are unreachable causing
        connection refused errors.
      turn_metrics:
        - custom:proposal_status
        - custom:proposal_evaluation_correctness
      turn_metrics_metadata:
        "custom:proposal_evaluation_correctness":
          threshold: 0.75

# --- ingress_rule_mismatch: NetworkPolicy blocking frontend-to-backend traffic ---
- conversation_group_id: ingress_rule_mismatch
  tag: ingress_rule_mismatch
  description: Network policy diagnosis — web-portal timeouts due to NetworkPolicy only allowing tier=backend ingress
  agent: proposal_agent
  agent_config:
    namespace: platform-core
  setup_script: scenarios/ingress_rule_mismatch/setup.sh
  cleanup_script: scenarios/ingress_rule_mismatch/cleanup.sh
  conversation_metrics: []
  conversation_metrics_metadata: {}
  turns:
    - turn_id: turn_1
      proposal_spec:
        request: >-
          The web-portal in namespace platform-core is getting timeouts
          connecting to api-gateway. Analyze the root cause, fix the
          issue, and verify the fix.
        targetNamespaces:
          - platform-core
        tools:
          skills:
            - image: quay.io/harpatil/agentic-skills:latest
              paths:
                - /skills/find-token
        analysis:
          agent: eval-default
        execution:
          agent: eval-default
        verification:
          agent: eval-default
      expected_proposal_status:
        phase: Completed
        max_duration: "10m"
        max_attempts: 5
        analysis:
          min_options: 1
        execution:
          phase: Succeeded
        verification:
          passed: true
      expected_outcome: >-
        Root cause: the NetworkPolicy restrict-api-gateway-ingress only
        allows ingress from pods with label tier=backend, but web-portal
        has tier=frontend. Remediation: update the NetworkPolicy ingress
        rules to also allow pods with tier=frontend, then verify
        web-portal can reach api-gateway.
      expected_analysis_outcome: >-
        The agent should identify that the NetworkPolicy on api-gateway
        restricts ingress to pods with tier=backend, which excludes
        the web-portal pod that has tier=frontend.
      expected_execution_outcome: >-
        The agent should update the NetworkPolicy to add a from selector
        allowing pods with tier=frontend to reach api-gateway on port 8080.
      expected_verification_outcome: >-
        The agent should verify that web-portal can successfully connect
        to api-gateway-svc without timeouts.
      turn_metrics:
        - custom:proposal_status
        - custom:proposal_evaluation_correctness
      turn_metrics_metadata:
        "custom:proposal_evaluation_correctness":
          threshold: 0.75

