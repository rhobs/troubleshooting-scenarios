- conversation_group_id: stuck_rollout
  description: |
    Rollout is stuck, deployment reports ProgressDeadlineExceeded.
    RCA: the new ReplicaSet's pod is in ImagePullBackOff on tag nginx-
    unprivileged:9.99-broken, which does not exist.
    Expected: roll back to the previous working revision.
  tag:
    - investigation
    - core
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          A recent release of shipping-tracker in namespace
          shipping-tracker is not completing. The rollout has been stuck
          for a while and the deployment reports it failed to progress.
          The previous version was healthy. Analyze what went wrong and
          recommend how to restore service.
        targetNamespaces:
          - shipping-tracker
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the new ReplicaSet's pod is in ImagePullBackOff
        because the rolled-out image tag nginx-unprivileged:9.99-broken
        does not exist, so the rollout hit ProgressDeadlineExceeded while
        the old ReplicaSet keeps serving (maxUnavailable: 0).
        Remediation: roll back to the previous working revision (or
        restore a valid image tag) and verify the rollout completes with
        the pod Running.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
