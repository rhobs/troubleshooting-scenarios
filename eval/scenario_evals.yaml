# Agentic troubleshooting scenario evaluations.
#
# Each scenario injects a broken cluster state via setup_script, creates a
# Proposal CR that triggers the agentic workflow (analysis → execution →
# verification), then validates the outcome via expected_proposal_status
# assertions and LLM-as-judge scoring.

# --- oom: OOMKill diagnosis — full lifecycle ---
- conversation_group_id: oom
  tag: oom
  description: OOMKill diagnosis — analysis, execution, and verification of a memory-leaking deployment
  agent: proposal_agent
  agent_config:
    namespace: oom-scenario
  setup_script: scenarios/oom/setup.sh
  cleanup_script: scenarios/oom/cleanup.sh
  conversation_metrics: []
  conversation_metrics_metadata: {}
  turns:
    - turn_id: turn_1
      proposal_spec:
        request: >-
          A deployment named awesome-application in namespace oom-scenario
          is in CrashLoopBackOff. Pods are being OOMKilled. Analyze the
          root cause, fix the memory configuration, and verify the fix.
        targetNamespaces:
          - oom-scenario
        tools:
          skills:
            - image: quay.io/harpatil/agentic-skills:latest
              paths:
                - /skills/find-token
        analysis:
          agent: eval-default
        execution:
          agent: eval-default
        verification:
          agent: eval-default
      expected_proposal_status:
        phase: Completed
        max_duration: "15m"
        max_attempts: 5
        analysis:
          min_options: 1
        execution:
          phase: Succeeded
        verification:
          passed: true
      expected_outcome: >-
        Root cause: the app container is being OOMKilled due to a deliberate
        memory leak in the pod command, while the container has a 60Mi memory
        limit. The deployment runs Python that appends ~1MB/sec forever.
        Remediation: increase the memory limit and verify the pod runs
        without further OOMKill events.
      expected_analysis_outcome: >-
        The agent should identify that awesome-application pods are being
        OOMKilled because the container runs a Python script that appends
        ~1MB per second indefinitely, while the memory limit is only 60Mi.
      expected_execution_outcome: >-
        The agent should increase the container memory limit by patching
        the deployment resource.
      expected_verification_outcome: >-
        The agent should verify the pods reach Running state without
        further OOMKill events after the memory limit increase.
      turn_metrics:
        - custom:proposal_status
        - custom:proposal_evaluation_correctness
      turn_metrics_metadata:
        "custom:proposal_evaluation_correctness":
          threshold: 0.75

# --- envvar_missing: CrashLoopBackOff due to missing environment variable ---
- conversation_group_id: envvar_missing
  tag: envvar_missing
  description: CrashLoop detection — order-fulfillment-daemon fails because DEPLOY_ENV is undefined
  agent: proposal_agent
  agent_config:
    namespace: warehouse-ops
  setup_script: scenarios/envvar_missing/setup.sh
  cleanup_script: scenarios/envvar_missing/cleanup.sh
  conversation_metrics: []
  conversation_metrics_metadata: {}
  turns:
    - turn_id: turn_1
      proposal_spec:
        request: >-
          A deployment named order-fulfillment-daemon in namespace warehouse-ops
          is in CrashLoopBackOff. Analyze the root cause, fix the issue,
          and verify the fix.
        targetNamespaces:
          - warehouse-ops
        tools:
          skills:
            - image: quay.io/harpatil/agentic-skills:latest
              paths:
                - /skills/find-token
        analysis:
          agent: eval-default
        execution:
          agent: eval-default
        verification:
          agent: eval-default
      expected_proposal_status:
        phase: Completed
        max_duration: "10m"
        max_attempts: 5
        analysis:
          min_options: 1
        execution:
          phase: Succeeded
        verification:
          passed: true
      expected_outcome: >-
        Root cause: the order-fulfillment-daemon container exits because the
        DEPLOY_ENV environment variable is undefined. The entrypoint script
        checks for DEPLOY_ENV and exits 1 if it is missing.
        Remediation: define the DEPLOY_ENV environment variable on the
        deployment and verify the pod reaches Running state.
      expected_analysis_outcome: >-
