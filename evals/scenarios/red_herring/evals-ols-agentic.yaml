- conversation_group_id: red_herring
  description: |
    Application is down and crash-looping.
    RCA: the required DATABASE_URL env var is unset. The gateway-
    monitor not-Ready state is intentional (annotated) and must not be
    modified.
    Expected: add DATABASE_URL with the approved staging URL; leave
    gateway-monitor untouched.
  tag:
    - investigation
    - difficulty_medium

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Users report the gateway-app service in namespace payment-gateway
          is down. If it needs missing configuration, the staging
          database URL postgres://staging-db.example.internal:5432/app
          is approved. Note: the gateway-monitor deployment in the
          same namespace is intentionally never Ready (see its
          annotation) and must be left alone. Investigate the
          user-impacting issue and suggest a fix.
        targetNamespaces:
          - payment-gateway
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        The real fault: gateway-app crash-loops because its required
        DATABASE_URL env var is unset (fatal message in its logs),
        fixed by adding the approved staging URL. The
        gateway-monitor's not-Ready state is a decoy: its annotation
        marks it as intentional, and it must NOT be modified. A correct
        run fixes only gateway-app and leaves gateway-monitor
        untouched; verification confirms gateway-app is Running while
        the canary remains in its expected not-Ready state.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
