- conversation_group_id: packet_drops_policy
  description: |
    Pods in namespace service-network cannot reach each other.
    RCA: NetworkPolicy blocks ingress from the frontend workload to the backend workload.
    Expected: Use NetObserv data to identify the policy-related denial, affected workloads, and supporting flow evidence.
  tag:
    - analysis
    - netobserv
    - difficulty_normal
  turns:
    - turn_id: packet_drops_policy
      query: >
        In namespace service-network, pods cannot reach each other and we
        suspect NetworkPolicy is blocking traffic. Use NetObserv to find network
        policy-related drops or denials in the last hour.
      expected_response: >
        Identifies NetworkPolicy-related denials in service-network using flow metrics
        and/or flows with OVS_DROP_EXPLICIT and packetLoss=dropped between web-client
        and api-service. Names the restrictive policy or source and destination
        workloads, cites evidence from tool output, and recommends NetworkPolicy
        review.
      turn_metrics: [custom:answer_correctness]
