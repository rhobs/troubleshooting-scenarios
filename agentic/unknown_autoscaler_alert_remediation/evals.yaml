- conversation_group_id: unknown_autoscaler_alert_remediation
  description: |
    Alert fires for an inactive HPA (ScalingActive=False).
    RCA: the deployment containers have no CPU resource requests, so
    the HPA cannot compute utilization percentage.
    Expected: add a CPU request to the container specification and verify the HPA becomes active.
  tag:
    - remediation
    - agentic
    - alert
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Alert: ProductCatalogHpaInactive (warning)
          Namespace: product-catalog
          Description: HPA product-catalog/catalog-api reports ScalingActive=False and cannot compute target metrics.
          Investigate the alert, remediate the root cause, and verify the recovery.
          Use the skill at /app/skills/cluster-troubleshoot/investigate-alert.
        targetNamespaces:
          - product-catalog
        tools:
          skills:
            - image: quay.io/openshiftanalytics/agentic-skills:latest
              paths:
                - /skills/cluster-troubleshoot/investigate-alert
        analysis:
          agent: default
        execution:
          agent: default
        verification:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"
          - type: Executed
            status: "True"
          - type: Verified
            status: "True"
        analysis:
          min_options: 1
        execution:
          phase: Succeeded
        verification:
          passed: true

      turn_metrics:
        - "custom:openshift_agentic_run_status"
