- conversation_group_id: diagnostic_trap
  description: |
    Deployment keeps crashing with a config file not found error.
    RCA: the ConfigMap is mounted at /etc/config but the app expects
    /etc/app/config.yaml, a mount-path mismatch. The tight 32Mi memory
    limit is a decoy (no OOMKill occurs).
    Expected: correct the volumeMount path to /etc/app.
  tag:
    - investigation
    - core
    - difficulty_medium

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          The deployment sync-app in namespace inventory-sync keeps
          crashing. Analyze the root cause carefully and suggest the
          correct fix.
        targetNamespaces:
          - inventory-sync
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the app requires /etc/app/config.yaml, but the
        sync-config ConfigMap is mounted at /etc/config, a mount-path
        mismatch plainly stated in the container's fatal log line. The
        tight-looking 32Mi memory limit is a decoy: the container exits
        with a clear config error, not an OOMKill. Remediation: mount
        the ConfigMap at /etc/app (or otherwise make the file appear at
        /etc/app/config.yaml); merely raising the memory limit does not
        fix the crash.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
