- conversation_group_id: orphaned_configmaps
  description: |
    Namespace has accumulated ConfigMaps over time.
    RCA: app-config-live is consumed by the running cm-user-app
    deployment; app-config-v1, feature-flags, and debug-settings are
    orphaned (unreferenced by any workload).
    Expected: identify in-use vs orphaned ConfigMaps and propose a
    cleanup plan for the orphaned ones.
  tag:
    - investigation
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Namespace deploy-artifacts has accumulated ConfigMaps over
          time. Analyze which team-created ConfigMaps are actually
          consumed by running workloads and which are orphaned, and
          propose a cleanup plan. Ignore platform-managed ConfigMaps
          (such as kube-root-ca.crt and openshift-service-ca.crt). Do
          not delete anything.
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        In use: app-config-live, consumed via envFrom by the running
        cm-user-app deployment. Orphaned cleanup candidates:
        app-config-v1, feature-flags, and debug-settings, which
        no workload references. Platform-managed maps (kube-root-ca.crt,
        openshift-service-ca.crt) are out of scope per the request. The
        plan should recommend confirming ownership and deleting the three
        orphans, leaving app-config-live untouched.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
