- conversation_group_id: missing_pvc
  description: |
    Pod is unschedulable (FailedScheduling).
    RCA: the volume references PersistentVolumeClaim app-data, which
    does not exist in the namespace.
    Expected: create the app-data PVC (1Gi, default StorageClass).
  tag:
    - analysis
    - difficulty_normal


  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          The deployment document-app in namespace document-store
          never gets a pod scheduled. The team says it needs a 1Gi volume
          named app-data that they forgot to create; the cluster's default
          storage class is fine. Analyze the root cause and suggest a fix.
        targetNamespaces:
          - document-store
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the pod is unschedulable because its volume
        references PersistentVolumeClaim app-data, which does not exist
        in the namespace (FailedScheduling: "persistentvolumeclaim
        app-data not found"). Remediation: create the app-data PVC (1Gi,
        default StorageClass) so the claim binds and the pod can be
        scheduled with the volume mounted.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
