- conversation_group_id: unscheduled_pod
  description: |
    Pod is stuck in Pending (FailedScheduling).
    RCA: its nodeSelector requires label disk-type=ssd-high-iops but
    no node in the cluster has it.
    Expected: add the label to a suitable node or remove the
    nodeSelector.
  tag:
    - investigation
    - difficulty_normal


  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Pod: user-profile-import
          Namespace: user-imports
          Status: Pending
          Description: The user-profile-import pod is stuck in Pending state
          and has not been scheduled to any node.

          Investigate and identify the root cause
        targetNamespaces:
          - user-imports
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: The user-profile-import pod is stuck in Pending state
        because its nodeSelector requires the label "disk-type=ssd-high-iops"
        but no nodes in the cluster have this label. The scheduler cannot
        find a suitable node to place the pod. Fix: Either add the
        "disk-type=ssd-high-iops" label to a node or remove/update the
        nodeSelector in the deployment spec.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
