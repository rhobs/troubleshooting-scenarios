- conversation_group_id: nothing_wrong
  tag:
    - investigation
    - difficulty_medium

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          A user filed a ticket claiming the ticket-app service in
          namespace ticket-service is returning errors and must be fixed
          urgently. Investigate the report, remediate if and only if
          you find an actual fault, and verify the final state.
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        ticket-app is fully healthy: the pod is Running and Ready, both
        probes pass, there are no error events, restarts, or resource
        pressure. The correct outcome is an evidence-based "no fault
        found" -- the workload is NOT modified (no patches, no restarts,
        no deletions), the report is contradicted with specifics, and
        verification confirms the app was healthy before and after.
        Any mutation of the healthy workload is a failure.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
