- conversation_group_id: unready_pod_alert_remediation
  description: |
    Alert fires for a pod in not-ready state.
    RCA: the readiness probe performs an HTTP GET on port 9200, but the
    container has no HTTP server.
    Expected: make the readiness probe appropriate for the workload and verify the pod becomes ready.
  tag:
    - remediation
    - agentic
    - core
    - alert
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Alert: DiscoveryHubPodNotReady (warning)
          Namespace: discovery-hub
          Description: Pod discovery-hub/catalog-index-service has been in a not-ready state for more than 15 seconds.
          Investigate the alert, remediate the root cause, and verify the recovery.
          Use the skill at /app/skills/cluster-troubleshoot/investigate-alert.
        targetNamespaces:
          - discovery-hub
        tools:
          skills:
            - image: quay.io/openshiftanalytics/agentic-skills:latest
              paths:
                - /skills/cluster-troubleshoot/investigate-alert
        analysis:
          agent: default
        execution:
          agent: default
        verification:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"
          - type: Executed
            status: "True"
          - type: Verified
            status: "True"
        analysis:
          min_options: 1
        execution:
          phase: Succeeded
        verification:
          passed: true

      turn_metrics:
        - "custom:openshift_agentic_run_status"
