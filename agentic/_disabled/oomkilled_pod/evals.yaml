- conversation_group_id: oomkilled_pod
  description: |
    Alert fires after report-generator restarts several times.
    RCA: the application stores every processed record in an unbounded cache and
    exceeds its 60Mi memory limit.
    Expected: identify the unbounded memory growth and recommend bounding the cache.
  tag:
    - agentic
    - core
    - alert
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Alert: DataProcessingPodRestarting (warning)
          Namespace: data-processing
          Description: Container in pod data-processing/report-generator has restarted multiple times. Check resource limits and application logs.
          Investigate using the skill at /app/skills/cluster-troubleshoot/investigate-alert
        targetNamespaces:
          - data-processing
        tools:
          skills:
            - image: quay.io/openshiftanalytics/agentic-skills:latest
              paths:
                - /skills/cluster-troubleshoot/investigate-alert
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: The report-generator pods are being OOMKilled because
        the container runs a Python script that caches every processed
        record without eviction, causing unbounded memory growth that
        exceeds the 60Mi memory limit. Fix: Either increase the memory
        limit or fix the application code to bound or evict the cache.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
