# --- storage_binding: PVC misconfiguration blocking memcached ---
- conversation_group_id: storage_binding
  tag: storage_binding
  description: PVC misconfiguration — memcached stuck pending due to invalid storageClassName
  agent: proposal_agent
  agent_config:
    namespace: cache-tier
    auto_approve: false
  setup_script: scenarios/storage_binding/setup.sh
  cleanup_script: scenarios/storage_binding/cleanup.sh
  conversation_metrics: []
  conversation_metrics_metadata: {}
  turns:
    - turn_id: turn_1
      proposal_spec:
        request: >-
          A memcached deployment in namespace cache-tier is not starting.
          The pod is stuck in Pending state. Analyze the root cause, fix
          the issue, and verify the fix.
        targetNamespaces:
          - cache-tier
        tools:
          skills:
            - image: quay.io/harpatil/agentic-skills:latest
              paths:
                - /skills/find-token
        analysis:
          agent: eval-default
        execution:
          agent: eval-default
        verification:
          agent: eval-default
      expected_proposal_status:
        phase: Completed
        max_duration: "10m"
        max_attempts: 5
        analysis:
          min_options: 1
        execution:
          phase: Succeeded
        verification:
          passed: true
      expected_outcome: >-
        Root cause: the PersistentVolumeClaim memcached-data-pvc references
        storageClassName "standard-v2" which does not exist on the cluster,
        causing a ProvisioningFailed event. The memcached pod is stuck in
        Pending because the PVC cannot be bound.
        Remediation: fix the storageClassName to a valid StorageClass and
        verify the PVC binds and the pod starts.
      expected_analysis_outcome: >-
        The agent should identify that the PVC memcached-data-pvc has a
        ProvisioningFailed event because the storageClassName "standard-v2"
        does not exist, and this is blocking the memcached pod from starting.
      expected_execution_outcome: >-
        The agent should update the PVC storageClassName to a valid
        StorageClass available on the cluster (e.g. by deleting and
        recreating the PVC with the correct class).
      expected_verification_outcome: >-
        The agent should verify the PVC is bound and the memcached pod
        reaches Running state.
      turn_metrics:
        - custom:proposal_status
        - custom:proposal_evaluation_correctness
      turn_metrics_metadata:
        "custom:proposal_evaluation_correctness":
          threshold: 0.75

# --- readiness_probe_diagnosis: Pod not ready due to failing readiness probe ---
- conversation_group_id: readiness_probe_diagnosis
  tag: readiness_probe_diagnosis
  description: Pod readiness probe failure — catalog-index-service not ready because no process listens on the probe port
  agent: proposal_agent
  agent_config:
    namespace: discovery-hub
  setup_script: scenarios/readiness_probe_diagnosis/setup.sh
  cleanup_script: scenarios/readiness_probe_diagnosis/cleanup.sh
  conversation_metrics: []
  conversation_metrics_metadata: {}
  turns:
    - turn_id: turn_1
      proposal_spec:
        request: >-
          A pod named catalog-index-service in namespace discovery-hub is
          not ready. Analyze the root cause, fix the issue, and verify
          the fix.
        targetNamespaces:
          - discovery-hub
        tools:
          skills:
            - image: quay.io/harpatil/agentic-skills:latest
              paths:
                - /skills/find-token
        analysis:
          agent: eval-default
        execution:
          agent: eval-default
        verification:
          agent: eval-default
      expected_proposal_status:
        phase: Completed
        max_duration: "10m"
        max_attempts: 5
        analysis:
          min_options: 1
        execution:
          phase: Succeeded
        verification:
          passed: true
      expected_outcome: >-
        Root cause: the catalog-index-service pod is not ready because its
        readiness probe (HTTP GET /healthz on port 9200) fails — the
        container runs a simple shell loop and does not serve HTTP on that
        port. Remediation: fix the readiness probe configuration or add
        an HTTP listener, then verify the pod becomes ready.
      expected_analysis_outcome: >-
        The agent should identify that the pod has a failing readiness probe
        configured to check /healthz on port 9200, but no process in the
        container listens on that port.
      expected_execution_outcome: >-
        The agent should fix the readiness probe (e.g. remove it, change it
        to an exec probe, or correct the port/path) so the pod can pass
        the readiness check.
      expected_verification_outcome: >-
        The agent should verify the pod reaches Ready state after the
        probe is fixed.
      turn_metrics:
        - custom:proposal_status
        - custom:proposal_evaluation_correctness
      turn_metrics_metadata:
        "custom:proposal_evaluation_correctness":
          threshold: 0.75

