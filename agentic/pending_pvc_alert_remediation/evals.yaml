- conversation_group_id: pending_pvc_alert_remediation
  description: |
    Alert fires for a PVC stuck in Pending.
    RCA: the PVC references StorageClass 'standard-v2' which does not
    exist in the cluster, and the init container uses a UID disallowed by
    restricted-v2 SCC.
    Expected: remediate the PVC and workload configuration, then verify the pod becomes available.
  tag:
    - remediation
    - agentic
    - core
    - alert
    - difficulty_medium

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Alert: CacheTierPersistentVolumeClaimPending (warning)
          Namespace: cache-tier
          Description: PersistentVolumeClaim cache-tier/memcached-data-pvc has been in Pending state for more than 15 seconds.
          Investigate the alert, remediate the root cause, and verify the recovery.
          Use the skill at /app/skills/cluster-troubleshoot/investigate-alert.
        targetNamespaces:
          - cache-tier
        tools:
          skills:
            - image: quay.io/openshiftanalytics/agentic-skills:latest
              paths:
                - /skills/cluster-troubleshoot/investigate-alert
        analysis:
          agent: default
        execution:
          agent: default
        verification:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"
          - type: Executed
            status: "True"
          - type: Verified
            status: "True"
        analysis:
          min_options: 1
        execution:
          phase: Succeeded
        verification:
          passed: true

      turn_metrics:
        - "custom:openshift_agentic_run_status"
