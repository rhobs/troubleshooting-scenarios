- conversation_group_id: cascading_failure
  description: |
    Frontend pod is Running but never becomes Ready.
    RCA: the backend is in ImagePullBackOff on a nonexistent tag
    (1.27-hardened); the frontend readiness probe correctly reflects
    the backend outage.
    Expected: correct the backend image to a valid tag (e.g. 1.27); do
    not weaken the frontend readiness probe.
  tag:
    - investigation
    - core
    - difficulty_medium

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Users report the order-frontend service in namespace
          order-processing is down. Its pod is Running but never
          becomes Ready. The backend it depends on should run the
          nginx-unprivileged image at version 1.27. Investigate the
          root cause and recommend a fix.
        targetNamespaces:
          - order-processing
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: order-frontend's readiness tracks reachability of
        order-backend, and the backend's pod is in ImagePullBackOff on
        the nonexistent tag 1.27-hardened. The frontend itself is
        fine. Remediation: fix the backend image to a valid tag (1.27);
        weakening or removing the frontend's readiness probe would mask
        the outage instead of fixing it. Verify the backend reaches
        Running and the frontend becomes Ready.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
