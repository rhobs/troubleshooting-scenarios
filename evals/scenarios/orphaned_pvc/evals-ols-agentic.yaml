- conversation_group_id: orphaned_pvc
  description: |
    Namespace may be paying for unused storage.
    RCA: primary-data is mounted by the running storage-app
    deployment; backup-data and scratch-data are orphaned
    (unreferenced by any pod or workload template).
    Expected: identify in-use vs orphaned PVCs and propose a cleanup
    plan for the orphaned ones.
  tag:
    - investigation
    - difficulty_normal
  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          The platform team suspects namespace artifact-storage is paying for
          storage nobody uses. Analyze which PersistentVolumeClaims in
          the namespace are mounted by running workloads and which are
          orphaned, and propose a cleanup plan for the orphaned ones.
          Do not delete anything.
        targetNamespaces:
          - artifact-storage
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        In use: primary-data, mounted at /data by the running
        storage-app deployment. Orphaned cleanup candidates:
        backup-data and scratch-data, which are referenced by no
        pod or workload template in the namespace. The analysis should
        recommend confirming with the owning team and then deleting the
        two orphaned claims to release their storage, without touching
        primary-data.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
