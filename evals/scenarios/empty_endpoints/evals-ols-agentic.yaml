- conversation_group_id: empty_endpoints
  description: |
    Service serves no traffic despite healthy backing pods.
    RCA: the service selector (app=proxy-backend) does not match the
    deployment's pod labels (app=proxy-app), so Endpoints has zero
    addresses.
    Expected: align the service selector with the pod labels.
  tag:
    - analysis
    - core
    - difficulty_normal


  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          The service proxy-svc in namespace auth-proxy
          serves no traffic even though its backing application is
          running and healthy. Analyze the root cause and suggest a fix.
        targetNamespaces:
          - auth-proxy
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the service proxy-svc selects pods labelled
        app=proxy-backend, but the deployment's pods are labelled
        app=proxy-app, so the service has zero endpoints while
        the pods are Running and Ready. Remediation: fix the service
        selector (or the pod labels) so they match, and verify the
        service's endpoints are populated with the ready pod.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
