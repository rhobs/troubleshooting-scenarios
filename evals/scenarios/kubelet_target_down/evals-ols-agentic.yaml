- conversation_group_id: kubelet_target_down
  description: |
    TargetDown warning alert fires for a kubelet endpoint.
    RCA: Deployment with excessive termination grace period (28800 seconds / 8
    hours) causes pods to accumulate in Terminating state when repeatedly
    deleted. This overwhelms the kubelet on the targeted node, making it
    unreachable.
    Expected: Identify the deployment with excessive terminationGracePeriodSeconds
    (28800s), recommend reducing it to a reasonable value (e.g., 30-60 seconds),
    and explain that the accumulation of terminating pods is overwhelming the
    kubelet.
  tag:
    - investigation
    - core
    - alert
    - difficulty_medium
    - kubelet

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Alert: TargetDown (warning)
          Namespace: batch-processor
          Description: A kubelet endpoint on one of the worker nodes is
          unreachable. The Prometheus target scrape is failing.

          Context: This is a monitoring gap in OpenShift clusters prior to
          version 4.23. The KubeletDown alert only fires when ALL kubelets are
          down, not when a single kubelet becomes unhealthy. This single
          kubelet being unreachable indicates a problem with that specific
          node's kubelet process that is not surfaced by a critical alert.

          Investigate the root cause using the following skills: investigate-alert
        tools:
          skills:
            - image: quay.io/openshiftanalytics/agentic-skills:latest
              paths:
                - /skills/cluster-troubleshoot/investigate-alert
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: The deployment report-generator in namespace
        batch-processor has an excessive terminationGracePeriodSeconds of
        28800 seconds (8 hours). When pods are repeatedly deleted or the
        deployment is scaled down, pods accumulate in Terminating state for
        hours instead of terminating quickly. This accumulation of terminating
        pods overwhelms the kubelet on the targeted node with stuck processes,
        causing the kubelet to become unreachable and triggering the TargetDown
        warning alert. Fix: Reduce the terminationGracePeriodSeconds in the
        deployment spec to a reasonable value such as 30 seconds, and delete the
        stuck Terminating pods to allow the kubelet to recover.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
