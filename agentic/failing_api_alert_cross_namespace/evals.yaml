- conversation_group_id: failing_api_alert_cross_namespace
  description: |
    Alert fires for 100% payment error rate (payments-api returns
    503).
    RCA: reporting-service in shared-services leaks database connections,
    exhausting the shared PostgreSQL pool; payments-api in payments cannot
    acquire a connection.
    Expected: identify shared-services/reporting-service as the root cause;
    shared-services/reconciliation-service CrashLooping is a separate issue,
    not the cause.
  tag:
    - agentic
    - core
    - alert
    - difficulty_hard

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Alert: PaymentErrorRateHigh (critical)
          Namespace: payments
          Description: Payment error rate is 100.00%, which exceeds the 15% threshold.
          Investigate using the skill at /app/skills/cluster-troubleshoot/investigate-alert
        targetNamespaces:
          - payments
          - shared-services
        tools:
          skills:
            - image: quay.io/openshiftanalytics/agentic-skills:latest
              paths:
                - /skills/cluster-troubleshoot/investigate-alert
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: shared-services/reporting-service is repeatedly opening DB
        connections and not releasing them properly, exhausting the connection
        slots on shared-services/postgres.
        payments/payments-api cannot obtain a DB connection and returns 503.
        if mentioned, shared-services/reconciliation-service CrashLooping is a
        separate issue, NOT RELATED to the DB connection exhaustion.
        Fix: rollback, restart, or scale down reporting-service.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.80
