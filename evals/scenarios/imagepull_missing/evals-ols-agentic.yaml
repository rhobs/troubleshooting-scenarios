- conversation_group_id: imagepull_missing
  description: |
    Deployment has no running pods after a recent change.
    RCA: the pod is in ImagePullBackOff because the image tag nginx-
    unprivileged:1.27-fips does not exist in the registry.
    Expected: correct the image tag to a valid version (e.g. 1.27).
  tag:
    - investigation
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          The deployment renderer-app in namespace asset-renderer
          has no running pods after a recent change. The team says the
          app should run the standard nginxinc/nginx-unprivileged image
          at version 1.27. Analyze the root cause and suggest a fix.
        targetNamespaces:
          - asset-renderer
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the pod is in ImagePullBackOff because the image tag
        docker.io/nginxinc/nginx-unprivileged:1.27-fips does not exist
        in the registry (manifest unknown). Remediation: correct the
        image reference to a valid tag (e.g. nginx-unprivileged:1.27)
        and verify the pod pulls the image and reaches Running state.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
