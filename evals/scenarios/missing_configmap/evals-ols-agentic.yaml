- conversation_group_id: missing_configmap
  description: |
    Container fails to start with CreateContainerConfigError.
    RCA: the deployment's envFrom references ConfigMap app-settings,
    which does not exist in the namespace.
    Expected: create the app-settings ConfigMap with LOG_LEVEL=info.
  tag:
    - investigation
    - core
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          The deployment feature-app in namespace
          feature-service is failing to start its container. The app
          loads its settings from a ConfigMap named app-settings that
          the team forgot to create; the only setting it needs is
          LOG_LEVEL, which should default to "info". Analyze the root
          cause and suggest a fix.
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the pod is in CreateContainerConfigError because the
        container's envFrom references ConfigMap app-settings, which does
        not exist in the namespace. Remediation: create the app-settings
        ConfigMap (with LOG_LEVEL: info) so the container can start, and
        verify the pod reaches Running state.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
