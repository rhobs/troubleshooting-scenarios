- conversation_group_id: missing_secret_key
  description: |
    Container fails to start with CreateContainerConfigError.
    RCA: the DB_PASSWORD env var references key 'password' in Secret
    db-creds, but the Secret only contains the 'username' key.
    Expected: add the missing 'password' key to the db-creds Secret.
  tag:
    - investigation
    - difficulty_normal


  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Deployment: credential-app
          Namespace: credential-store
          Status: CreateContainerConfigError
          Description: The deployment credential-app in namespace
          credential-store cannot start its container. It reads database
          credentials from the Secret db-creds. Analyze the root cause
          and fix it — if a credential value is missing, use the
          placeholder value "changeme" so the team can rotate it later.
          Verify the pod is running.
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the container is in CreateContainerConfigError
        because its DB_PASSWORD env var references key "password" in
        Secret db-creds, but the secret only contains the "username"
        key. Fix: add the missing "password" key to the db-creds
        Secret (placeholder value "changeme") and verify the pod
        reaches Running state.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
