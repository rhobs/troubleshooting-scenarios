- conversation_group_id: recurring_batch_failure
  description: |
    Some historical batch runs fail while most runs complete successfully.
    RCA: calls to the upstream service time out between 03:00 and 03:05 UTC;
    calls outside this window succeed.
    Expected: identify the recurring time window and upstream connection failures.
  tag:
    - agentic
    - difficulty_medium


  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          The batch-processor in the data-pipeline namespace is processing
          historical records. Some pod ERROR logs reported issues.
          Investigate and identify when the errors occur and what is
          causing them.
        targetNamespaces:
          - data-pipeline
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the batch-processor pod experiences repeated failures
        during the 03:00-03:05 UTC window. The errors show "Batch submission
        failed" with connection timeouts to https://pipeline-intake.corp.net/submit.
        This is a recurring time-bounded pattern consistent with a scheduled
        maintenance window on the upstream service. Outside this window the
        batch-processor operates normally, completing batch jobs successfully.
        The failures are not caused by a bug in the batch-processor itself.
        Fix: schedule batch jobs outside the 03:00-03:05 maintenance window,
        or implement retry logic with backoff to handle transient upstream
        unavailability.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
