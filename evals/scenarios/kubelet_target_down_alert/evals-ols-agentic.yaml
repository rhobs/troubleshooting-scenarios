- conversation_group_id: kubelet_target_down_alert
  description: |
    TargetDown warning alert fires for a kubelet endpoint.

    **OpenShift Version Requirement: This scenario is designed for OCP 4.x only.**
    It works reliably on OCP 4.22 but does NOT trigger kubelet TargetDown on OCP 5.0+
    due to kubelet resilience improvements in newer versions.

    RCA: Deployment with excessive termination grace period (28800 seconds / 8
    hours) and continuous disk I/O operations cause pods to accumulate in
    Terminating state when repeatedly deleted. Combined with sustained disk I/O
    load, this overwhelms the kubelet on the targeted node, making it unreachable.
    Expected: Identify the deployment with excessive terminationGracePeriodSeconds
    (28800s), recommend reducing it to a reasonable value (e.g., 30-60 seconds),
    and explain that the accumulation of terminating pods combined with disk I/O
    pressure is overwhelming the kubelet.
  tag:
    - investigation
    - alert
    - difficulty_medium
    - kubelet

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Alert: TargetDown (warning)
          Namespace: kube-system
          Description: 100% of the kubelet/kubelet targets in kube-system namespace
          have been unreachable for more than 15 minutes. This may be a symptom of network
          connectivity issues, down nodes, or failures within these components. Assess the
          health of the infrastructure and nodes running these targets and then contact support.

          Investigate the root cause using the following skills: investigate-alert
        tools:
          skills:
            - image: quay.io/openshiftanalytics/agentic-skills:latest
              paths:
                - /skills/cluster-troubleshoot/investigate-alert
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: The deployment report-generator in namespace
        batch-processor has an excessive terminationGracePeriodSeconds of
        28800 seconds (8 hours) and performs continuous disk I/O operations
        across multiple emptyDir volumes. When pods are repeatedly deleted or
        the deployment is scaled down, pods accumulate in Terminating state for
        hours instead of terminating quickly. The combination of sustained disk
        I/O load and accumulation of terminating pods overwhelms the kubelet on
        the targeted node, causing the kubelet to become unreachable and
        triggering the TargetDown warning alert. Fix: Reduce the
        terminationGracePeriodSeconds in the deployment spec to a reasonable
        value such as 30 seconds, and delete the stuck Terminating pods to allow
        the kubelet to recover.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
