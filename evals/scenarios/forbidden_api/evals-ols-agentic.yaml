- conversation_group_id: forbidden_api
  description: |
    Application logs HTTP 403 when listing pods via the Kubernetes
    API.
    RCA: the ServiceAccount app-inspector-sa has no Role or
    RoleBinding granting API access.
    Expected: create a namespaced Role granting get/list on pods and
    bind it to the ServiceAccount.
  tag:
    - investigation
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Deployment: inspector-app
          Namespace: pod-inspector
          Status: App logging "ERROR: cannot list pods" with HTTP 403
          Description: The inspector-app app calls the Kubernetes API to
          list pods in its own namespace, but every call returns HTTP 403. The
          app legitimately requires listing pods in its own namespace, nothing
          more.

          Analyze the root cause, grant exactly the access the app needs
          (least privilege), and verify the app logs successful API calls.
        targetNamespaces:
          - pod-inspector
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: The app runs as ServiceAccount app-inspector-sa, which
        has no Role or RoleBinding, so its pod-list API calls return HTTP
        403. Fix: Create a namespaced Role granting only get/list on pods
        and a RoleBinding attaching it to app-inspector-sa — not
        cluster-admin or a ClusterRoleBinding — then verify the app's logs
        show HTTP 200 responses.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
