---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-proxy
  namespace: ingress-layer
  labels:
    app: gateway-proxy
    component: ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-proxy
  template:
    metadata:
      labels:
        app: gateway-proxy
        component: ingress
    spec:
      containers:
        - name: gateway
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: configuration
              mountPath: /etc/gateway
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: gateway-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-proxy
  namespace: ingress-layer
spec:
  selector:
    app: gateway-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
