- conversation_group_id: unknown_autoscaler
  description: |
    HPA shows ScalingActive=False, CPU target shows <unknown>.
    RCA: the deployment containers have no CPU resource requests, so
    the HPA cannot compute utilization percentage.
    Expected: add CPU requests (e.g. 50m-100m) to the container spec.
  tag:
    - investigation
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          HPA: catalog-api
          Namespace: product-catalog
          Status: ScalingActive=False, CPU target shows <unknown>
          Description: The HorizontalPodAutoscaler for catalog-api
          never scales the app and shows its CPU target as <unknown>.

          Investigate why the autoscaler cannot read metrics, fix the
          configuration, and verify the HPA reports a real utilization value.
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: The HPA targets CPU utilization, which is computed as
        a percentage of the pod's CPU request, but the
        catalog-api containers set no resource requests. The
        HPA reports FailedGetResourceMetric ("missing request for cpu")
        and ScalingActive=False. Fix: Add CPU requests (e.g. 50m-100m)
        to the deployment's containers so utilization can be computed,
        then verify the HPA reports a concrete CPU utilization value and
        ScalingActive=True.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
