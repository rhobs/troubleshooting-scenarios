- conversation_group_id: pending_pvc_alert
  description: |
    Alert fires for a PVC stuck in Pending.
    RCA: the PVC references StorageClass 'standard-v2' which does not
    exist in the cluster. The init container also uses runAsUser: 65532,
    which violates the namespace UID range enforced by restricted-v2 SCC.
    Expected: change the PVC's StorageClass to a valid one or create
    the missing StorageClass, and use a UID allowed by the SCC.
  tag:
    - investigation
    - core
    - alert
    - difficulty_high


  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Alert: CacheTierPersistentVolumeClaimPending (warning)
          Namespace: cache-tier
          Description: PersistentVolumeClaim cache-tier/memcached-data-pvc has been in Pending state for more than 15 seconds.
          Investigate using the skill at /app/skills/cluster-troubleshoot/investigate-alert
        targetNamespaces:
          - cache-tier
        tools:
          skills:
            - image: quay.io/openshiftanalytics/agentic-skills:latest
              paths:
                - /skills/cluster-troubleshoot/investigate-alert
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: The memcached-data-pvc PersistentVolumeClaim is stuck in
        Pending state because it references a StorageClass named "standard-v2"
        that does not exist in the cluster. The PVC cannot be provisioned
        without a valid StorageClass. Additionally, the init container
        specifies runAsUser: 65532 which falls outside the namespace UID range
        enforced by the restricted-v2 SCC, causing a security context
        violation. Fix: Update the PVC storageClassName to an available
        StorageClass in the cluster (e.g. gp2, gp3-csi) or create the missing
        "standard-v2" StorageClass, and fix the init container's runAsUser to
        a UID within the namespace's allowed range.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
