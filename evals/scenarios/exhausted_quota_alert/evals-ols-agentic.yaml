- conversation_group_id: exhausted_quota_alert
  description: |
    Alert fires for zero available replicas.
    RCA: the namespace ResourceQuota caps pods at 2, fully consumed by
    setup-worker's 2 replicas; the ReplicaSet fails with 'exceeded
    quota' events.
    Expected: raise the pod quota to accommodate both workloads, or
    scale down setup-worker to free a pod slot.
  tag:
    - analysis
    - alert
    - difficulty_normal

  turns:
    - turn_id: turn_1
      openshift_agentic_run_spec:
        request: |
          Alert: TeamOnboardingDeploymentUnavailable (warning)
          Namespace: team-onboarding
          Description: Deployment team-onboarding/onboarding-app has 0 available replicas for more than 15 seconds.
          Investigate using the skill at /app/skills/cluster-troubleshoot/investigate-alert
        targetNamespaces:
          - team-onboarding
        tools:
          skills:
            - image: quay.io/openshiftanalytics/agentic-skills:latest
              paths:
                - /skills/cluster-troubleshoot/investigate-alert
        analysis:
          agent: default

      expected_openshift_agentic_run_status:
        phase: Completed
        conditions:
          - type: Analyzed
            status: "True"

      expected_outcome: >-
        Root cause: the namespace's ResourceQuota team-pod-quota caps
        pods at 2, fully consumed by setup-worker's 2 replicas -- the
        onboarding-app ReplicaSet fails pod creation with "exceeded
        quota" events and no pod is ever created. Acceptable fixes:
        raise the pod quota (e.g. to 3 or more) to accommodate both
        workloads, or scale down setup-worker to free a pod slot.
        Either way, verify onboarding-app's pod is created and Running.

      turn_metrics:
        - "custom:openshift_agentic_run_status"
        - "custom:openshift_agentic_run_evaluation_correctness"
      turn_metrics_metadata:
        "custom:openshift_agentic_run_evaluation_correctness":
          threshold: 0.75
