apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-generator
  namespace: data-processing
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: report-generator
  template:
    metadata:
      labels:
        app: report-generator
    spec:
      nodeSelector:
        kubernetes.io/arch: ARCHITECTURE_PLACEHOLDER
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: report-generator:1.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: BATCH_SIZE
              value: "100"
            - name: BATCH_INTERVAL_SECONDS
              value: "0.25"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
